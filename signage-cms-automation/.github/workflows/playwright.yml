# =============================================================================
#  CI pipeline — runs the Signage CMS smoke suite on push / PR and nightly.
#  Publishes the Playwright HTML report and Allure results as artifacts.
# =============================================================================
name: CMS Playwright E2E

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * *' # nightly 02:00 UTC
  workflow_dispatch:

defaults:
  run:
    working-directory: signage-cms-automation

jobs:
  smoke:
    name: Smoke (chromium)
    timeout-minutes: 30
    runs-on: ubuntu-latest

    env:
      CMS_BASE_URL: ${{ secrets.CMS_BASE_URL || 'https://cms.wilyersignage.com' }}
      CMS_ADMIN_EMAIL: ${{ secrets.CMS_ADMIN_EMAIL }}
      CMS_ADMIN_PASSWORD: ${{ secrets.CMS_ADMIN_PASSWORD }}
      CMS_STRICT_MONITORS: 'false'
      CMS_FAIL_ON_SERVER_ERROR: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: signage-cms-automation/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        run: npx playwright test --project=chromium --grep @smoke

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: signage-cms-automation/playwright-report
          retention-days: 14

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: signage-cms-automation/allure-results
          retention-days: 14

      - name: Upload traces & videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: signage-cms-automation/test-results
          retention-days: 7
