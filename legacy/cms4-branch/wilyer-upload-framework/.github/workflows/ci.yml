name: Wilyer Upload Framework CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'wilyer-upload-framework/**'
  pull_request:
    paths:
      - 'wilyer-upload-framework/**'
  workflow_dispatch:
    inputs:
      grep:
        description: 'Tag/grep filter (e.g. @smoke)'
        required: false
        default: ''

defaults:
  run:
    working-directory: wilyer-upload-framework

jobs:
  test:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wilyer-upload-framework/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run tests
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          MAKER_EMAIL: ${{ secrets.MAKER_EMAIL }}
          MAKER_PASSWORD: ${{ secrets.MAKER_PASSWORD }}
          MAKER_NAME: ${{ secrets.MAKER_NAME }}
          CHECKER_EMAIL: ${{ secrets.CHECKER_EMAIL }}
          CHECKER_PASSWORD: ${{ secrets.CHECKER_PASSWORD }}
          CHECKER_NAME: ${{ secrets.CHECKER_NAME }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          NOTIFICATION_FROM: ${{ secrets.NOTIFICATION_FROM }}
        run: npx playwright test --project=${{ matrix.project }} ${{ github.event.inputs.grep && format('--grep {0}', github.event.inputs.grep) || '' }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: wilyer-upload-framework/playwright-report
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: wilyer-upload-framework/allure-results
          retention-days: 14

      - name: Archive traces & videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.project }}
          path: |
            wilyer-upload-framework/test-results
          retention-days: 14

  allure-report:
    name: Publish Allure report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results-merged
          merge-multiple: true

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.9
        with:
          allure_results: allure-results-merged
          allure_report: allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30
